[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solar-advisor-mcp"
version = "0.1.0"
description = "MCP server wrapping the Solar Advisor LangGraph agent (solar-advisor.danhle.net). Exposes solar-economics queries as MCP tools so any MCP client (Claude Desktop, Claude Code) can drive the composite-data solar agent."
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Danh Le"}]
dependencies = [
    "mcp>=1.1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[project.scripts]
solar-advisor-mcp = "advisor_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["advisor_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
